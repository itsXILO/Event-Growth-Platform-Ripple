name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ripple
          POSTGRES_PASSWORD: ripple_secret
          POSTGRES_DB: ripple_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-cmd-interval 10s
          --health-cmd-timeout 5s
          --health-cmd-retries 5

    env:
      DATABASE_URL: postgresql://ripple:ripple_secret@localhost:5432/ripple_db
      PORT: 4000
      NODE_ENV: test
      CLIENT_ORIGIN: http://localhost:5173
      ADMIN_PASSWORD: admin123
      RESEND_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Lint codebase
        run: npm run lint

      - name: Run database migrations & seed demo data
        run: |
          npm run db:migrate --prefix server
          npm run db:seed --prefix server

      - name: Run test suite (Vitest)
        run: npm test

      - name: Production build (Client & Server)
        run: npm run build
